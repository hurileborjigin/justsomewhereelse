<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Planet</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>"
    />
    <style>
      :root {
        --ink: #2b3a2a;
        --paper: rgba(255, 255, 253, 0.88);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", Quicksand,
          Comfortaa, Manjari, sans-serif;
        color: var(--ink);
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 14px;
        left: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
        user-select: none;
      }
      #hud > div {
        background: var(--paper);
        border-radius: 12px;
        padding: 8px 12px;
        font-size: 14px;
        box-shadow: 0 2px 10px rgba(30, 60, 30, 0.15);
        width: fit-content;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #d05a5a;
        display: inline-block;
      }
      #dot.on {
        background: #58b368;
      }
      #hint {
        opacity: 0.75;
      }
      #swap {
        position: fixed;
        right: 16px;
        bottom: 16px;
        border: none;
        border-radius: 14px;
        padding: 10px 16px;
        font: inherit;
        font-size: 14px;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(30, 60, 30, 0.2);
      }
      #swap:hover {
        transform: translateY(-1px);
      }
      #loading,
      #full-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-size: 18px;
        background: linear-gradient(#8ec9ff, #fdf0dc);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="status"><span id="dot"></span><span id="status-text">connecting…</span></div>
      <div id="who">…</div>
      <div id="waiting">Waiting for your partner…</div>
      <div id="hint">WASD or arrow keys to walk, square by square</div>
    </div>
    <button id="swap" hidden>Swap characters 🐝↔🫏</button>
    <div id="loading">Loading tiny planet…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
