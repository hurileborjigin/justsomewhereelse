<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Haven</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>"
    />
    <style>
      :root {
        --ink: #2b3a2a;
        --paper: rgba(255, 255, 253, 0.88);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", Quicksand,
          Comfortaa, Manjari, sans-serif;
        color: var(--ink);
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      body.looking #game {
        cursor: grabbing;
      }
      /* --- mobile controls (shown only on touch devices via body.touch) --- */
      #dpad,
      #zoom-slider {
        display: none;
      }
      body.touch #dpad {
        display: grid;
        position: fixed;
        left: 16px;
        bottom: 88px;
        grid-template-areas: ". u ." "l c r" ". d .";
        grid-template-columns: 54px 54px 54px;
        grid-template-rows: 54px 54px 54px;
        gap: 4px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #dpad button {
        border: none;
        border-radius: 14px;
        background: rgba(255, 255, 253, 0.22);
        border: 1.5px solid rgba(255, 255, 253, 0.35);
        backdrop-filter: blur(4px);
        color: rgba(43, 58, 42, 0.65);
        font-size: 18px;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        padding: 0;
      }
      #dpad button.pressed {
        background: rgba(255, 255, 253, 0.55);
      }
      #run-toggle {
        border-radius: 50% !important;
        font-size: 16px !important;
      }
      #run-toggle.on {
        background: rgba(255, 205, 112, 0.75) !important;
        color: rgba(80, 50, 10, 0.9) !important;
      }
      body.touch #zoom-slider {
        display: block;
        position: fixed;
        right: 12px;
        top: 26%;
        height: 44%;
        width: 40px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #zoom-track {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 6px;
        margin-left: -3px;
        border-radius: 3px;
        background: rgba(255, 255, 253, 0.3);
      }
      #zoom-handle {
        position: absolute;
        left: 50%;
        top: 0;
        width: 30px;
        height: 30px;
        margin-left: -15px;
        transform: translateY(-50%);
        border-radius: 50%;
        background: rgba(255, 255, 253, 0.5);
        box-shadow: 0 1px 6px rgba(30, 60, 30, 0.25);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: rgba(43, 58, 42, 0.6);
      }
      #status {
        position: fixed;
        bottom: 10px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        opacity: 0.55;
        pointer-events: none;
        user-select: none;
      }
      #dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d05a5a;
        display: inline-block;
      }
      #dot.on {
        background: #58b368;
      }
      /* --- chat ------------------------------------------------------- */
      #bubbles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .name-tag {
        position: absolute;
        transform: translate(-50%, calc(-100% - 4px));
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        letter-spacing: 0.01em;
        color: #2b3a2a;
        background: rgba(255, 255, 253, 0.78);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 999px;
        padding: 2px 9px;
        white-space: nowrap;
        box-shadow: 0 2px 8px rgba(30, 60, 30, 0.12);
        transition: opacity 0.15s;
        user-select: none;
      }
      /* --- floating box labels ------------------------------------------ */
      #box-labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .box-label {
        position: absolute;
        transform: translate(-50%, calc(-100% - 6px));
        font-size: 11px;
        letter-spacing: 0.01em;
        color: #2b3a2a;
        background: rgba(255, 255, 253, 0.82);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 999px;
        padding: 3px 9px;
        white-space: nowrap;
        max-width: 180px;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: 0 2px 10px rgba(30, 60, 30, 0.14);
        transition: opacity 0.15s;
        user-select: none;
      }
      .bubble {
        position: absolute;
        transform: translate(-50%, calc(-100% - 34px));
        background: rgba(255, 255, 253, 0.92);
        border-radius: 14px;
        padding: 8px 12px;
        font-size: 13.5px;
        line-height: 1.35;
        max-width: 220px;
        width: max-content;
        overflow-wrap: break-word;
        box-shadow: 0 6px 18px rgba(30, 60, 30, 0.16);
        transition: opacity 0.15s;
      }
      .bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: rgba(255, 255, 253, 0.92);
        border-bottom: none;
      }
      #chat-form {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
      }
      #chat-preview[hidden] {
        display: none;
      }
      #chat-preview {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        display: flex;
        align-items: flex-start;
        gap: 4px;
        background: rgba(255, 255, 253, 0.75);
        backdrop-filter: blur(6px);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 1px 8px rgba(30, 60, 30, 0.18);
      }
      #chat-preview img,
      #chat-preview video {
        max-width: 92px;
        max-height: 92px;
        border-radius: 8px;
        display: block;
      }
      #chat-preview button {
        border: none;
        background: rgba(43, 58, 42, 0.12);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        font-size: 10px;
        cursor: pointer;
        padding: 0;
      }
      #actions {
        position: fixed;
        bottom: 68px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #actions button {
        border: none;
        border-radius: 999px;
        padding: 9px 16px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
        background: #58b368;
        color: white;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(30, 60, 30, 0.18);
        white-space: nowrap;
        /* a long box label shortens with an ellipsis instead of spilling off a phone */
        max-width: calc(100vw - 32px);
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #actions button:hover {
        transform: translateY(-1px);
      }
      #actions button[hidden] {
        display: none;
      }
      #actions #box-btn {
        background: #d9962f;
        box-shadow: 0 2px 12px rgba(90, 60, 10, 0.3);
      }
      /* on a touch phone the stack stands in the column beside the d-pad instead of over its arrows */
      @media (max-width: 640px) {
        body.touch #actions {
          left: auto;
          right: 16px;
          bottom: 88px;
          transform: none;
          width: calc(100vw - 212px);
          align-items: stretch;
        }
        body.touch #actions button {
          white-space: normal;
          overflow-wrap: anywhere;
          padding: 9px 12px;
          font-size: 14px;
          line-height: 1.3;
        }
        body.touch #actions #sign-btn {
          align-self: center;
        }
        body.touch #toast {
          /* up top, clear of the character, the d-pad and the stack */
          top: max(70px, calc(var(--panels-bottom, 0px) + 10px)); /* and below an open panel */
          bottom: auto;
        }
      }
      /* phones have no E key: the hint on the action buttons is for keyboards only */
      body.touch .key-hint {
        display: none;
      }
      #actions #sign-btn {
        padding: 5px 14px;
        font-size: 12.5px;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: rgba(255, 255, 253, 0.82);
        color: var(--ink);
        box-shadow: 0 4px 14px rgba(30, 60, 30, 0.12);
      }
      #chat-input {
        width: min(46vw, 380px);
        border: none;
        border-radius: 999px;
        padding: 10px 16px;
        font: inherit;
        font-size: 14px;
        background: rgba(255, 255, 253, 0.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--ink);
        box-shadow: 0 4px 16px rgba(30, 60, 30, 0.12);
        outline: none;
      }
      #chat-input::placeholder { color: rgba(43, 58, 42, 0.4); }
      #chat-form button {
        border: none;
        border-radius: 999px;
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        background: rgba(255, 255, 253, 0.72);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(30, 60, 30, 0.12);
      }
      #chat-form button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .bubble img,
      .bubble video,
      .msg img,
      .msg video {
        display: block;
        max-width: 180px;
        max-height: 140px;
        border-radius: 8px;
        margin-top: 4px;
        cursor: pointer;
        pointer-events: auto;
      }
      .msg img,
      .msg video {
        max-width: 100%;
      }
      #lightbox[hidden] {
        display: none;
      }
      #lightbox {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 16, 0.88);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
      }
      #lightbox img,
      #lightbox video {
        max-width: 92vw;
        max-height: 92vh;
        border-radius: 10px;
      }
      #chat-panel {
        position: fixed;
        top: 14px;
        right: 14px;
        width: 240px;
        background: rgba(255, 255, 253, 0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(30, 60, 30, 0.12);
        overflow: hidden;
        font-size: 12.5px;
        color: rgba(43, 58, 42, 0.9);
      }
      #chat-panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 8px 6px 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #chat-min {
        border: none;
        background: none;
        font: inherit;
        cursor: pointer;
        padding: 0 8px;
        color: var(--ink);
        opacity: 0.55;
      }
      #chat-log {
        max-height: 38vh;
        overflow-y: auto;
        padding: 0 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #chat-log:empty::before {
        content: "No messages yet.";
        opacity: 0.4;
        font-size: 12px;
      }
      .msg {
        border-radius: 12px;
        padding: 6px 10px;
        overflow-wrap: break-word;
        line-height: 1.35;
      }
      .msg {
        position: relative;
      }
      .msg .recall {
        display: none;
        margin-top: 4px;
        border: none;
        background: none;
        padding: 0;
        font: inherit;
        font-size: 11px;
        color: inherit;
        opacity: 0.5;
        cursor: pointer;
      }
      @media (hover: hover) and (pointer: fine) {
        .msg.me:hover .recall { display: inline; }
      }
      .msg .recall:hover { opacity: 1; }
      .recall-ask {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 6px;
        font-size: 11.5px;
        opacity: 0.8;
      }
      .recall-ask button {
        border: none;
        background: none;
        padding: 0;
        font: inherit;
        font-size: 11.5px;
        font-weight: 600;
        color: inherit;
        cursor: pointer;
      }
      .recall-ask button:last-of-type { opacity: 0.5; font-weight: 500; }
      .recall-ask button:hover { opacity: 1; }
      .msg.me {
        background: rgba(88, 179, 104, 0.16);
        align-self: flex-end;
      }
      .msg.peer {
        background: rgba(43, 58, 42, 0.06);
        align-self: flex-start;
      }
      #chat-open {
        position: fixed;
        top: 14px;
        right: 14px;
        width: 42px;
        height: 42px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 14px;
        font-size: 18px;
        background: rgba(255, 255, 253, 0.55);
        box-shadow: 0 4px 14px rgba(30, 60, 30, 0.12);
        cursor: pointer;
      }
      #chat-open[hidden] { display: none; }
      #chat-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #d05a5a;
        color: white;
        font-size: 11px;
        border-radius: 9px;
        padding: 2px 6px;
      }
      /* --- treasures ---------------------------------------------------- */
      #treasure-open,
      #music-open {
        position: fixed;
        top: 14px;
        width: 42px;
        height: 42px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 14px;
        background: rgba(255, 255, 253, 0.55);
        box-shadow: 0 4px 14px rgba(30, 60, 30, 0.12);
        cursor: pointer;
        line-height: 1;
      }
      #treasure-open { left: 14px; }
      #music-open { left: 64px; font-size: 18px; }
      #treasure-open.on,
      #music-open.on {
        background: rgba(255, 255, 253, 0.92);
        box-shadow: inset 0 0 0 1.5px rgba(43, 58, 42, 0.22), 0 4px 14px rgba(30, 60, 30, 0.12);
      }
      #music-panel.beside {
        left: calc(14px + min(270px, 100vw - 28px) + 10px);
      }
      @media (max-width: 640px) {
        #treasure-open,
        #music-open,
        #chat-open {
          top: max(14px, env(safe-area-inset-top));
        }
        #treasure-open { left: max(14px, env(safe-area-inset-left)); }
        #music-open { left: calc(max(14px, env(safe-area-inset-left)) + 50px); }
        #chat-open { right: max(14px, env(safe-area-inset-right)); }
        #chat-panel {
          top: max(14px, env(safe-area-inset-top));
          right: max(14px, env(safe-area-inset-right));
          width: min(220px, calc(100vw - 128px - env(safe-area-inset-left) - env(safe-area-inset-right)));
        }
        #music-panel,
        #treasure-panel {
          top: calc(max(14px, env(safe-area-inset-top)) + 50px);
          left: max(12px, env(safe-area-inset-left));
          width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));
          max-height: min(52vh, 460px);
        }
        #chat-form {
          bottom: max(12px, env(safe-area-inset-bottom));
          width: min(520px, calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right)));
        }
        #chat-input { width: auto; flex: 1; min-width: 0; }
      }
      #treasure-open[hidden],
      #treasure-panel[hidden] {
        display: none;
      }
      #treasure-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #d9962f;
        color: white;
        font-size: 11px;
        line-height: 1.2; /* the button beneath sets line-height 0 for its icon */
        border-radius: 9px;
        padding: 2px 6px;
      }
      #music-open[hidden],
      #music-panel[hidden],
      #music-connect[hidden],
      #music-controls[hidden],
      #music-notice[hidden],
      #music-upnext[hidden],
      #music-art[hidden] {
        display: none;
      }
      #music-panel {
        position: fixed;
        top: 64px;
        left: 14px;
        width: min(260px, calc(100vw - 28px));
        max-height: min(72vh, 560px);
        overflow: auto;
        background: rgba(255, 255, 253, 0.55);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 16px;
        box-shadow: 0 8px 28px rgba(30, 60, 30, 0.12);
        font-size: 12.5px;
        color: rgba(43, 58, 42, 0.9);
      }
      #music-panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 8px 0 14px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #music-min {
        border: none;
        background: none;
        font: inherit;
        cursor: pointer;
        padding: 0 8px;
        color: var(--ink);
        opacity: 0.55;
      }
      #music-with {
        margin: 1px 14px 10px;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0.45;
      }
      #music-notice {
        margin: 0 14px 8px;
        font-size: 11.5px;
        line-height: 1.35;
        opacity: 0.7;
      }
      #music-connect {
        display: block;
        margin: 4px 14px 14px;
        width: calc(100% - 28px);
        border: none;
        border-radius: 12px;
        padding: 9px 12px;
        background: rgba(43, 58, 42, 0.08);
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #music-controls { padding: 0 14px 12px; }
      #music-now { display: flex; gap: 10px; align-items: center; }
      #music-artbox {
        width: 54px;
        height: 54px;
        border-radius: 10px;
        overflow: hidden;
        flex: none;
        background: rgba(43, 58, 42, 0.08);
      }
      #music-art { width: 100%; height: 100%; object-fit: cover; display: block; }
      #music-meta { min-width: 0; }
      #music-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      #music-title, #music-artist {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #music-title { flex: 1; min-width: 0; font-weight: 600; font-size: 13.5px; }
      #music-lyrics {
        flex: none;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: none;
        color: rgba(43, 58, 42, 0.55);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #music-lyrics svg { width: 16px; height: 16px; display: block; }
      #music-lyrics:hover { color: rgba(43, 58, 42, 0.9); }
      #music-artist { display: block; margin-top: 2px; font-size: 11.5px; opacity: 0.55; }
      #music-scrub { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; }
      #music-bar {
        flex: 1;
        appearance: none;
        height: 3px;
        border-radius: 2px;
        background: rgba(43, 58, 42, 0.15);
        outline: none;
        cursor: pointer;
      }
      #music-bar::-webkit-slider-thumb {
        appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ink);
      }
      #music-time { font-size: 10px; opacity: 0.45; font-variant-numeric: tabular-nums; min-width: 28px; }
      #music-transport { display: flex; gap: 2px; margin: 2px 0 8px; }
      #music-transport button {
        border: none;
        background: none;
        color: inherit;
        font: inherit;
        font-size: 14px;
        width: 32px;
        height: 28px;
        border-radius: 8px;
        cursor: pointer;
      }
      #music-transport button:hover { background: rgba(43, 58, 42, 0.06); }
      #music-repeat { color: rgba(43, 58, 42, 0.4); position: relative; }
      #music-repeat svg { width: 16px; height: 16px; display: block; margin: 0 auto; }
      #music-repeat.on { color: #1db954; }
      #music-repeat.one::after {
        content: "1";
        position: absolute;
        right: 6px;
        bottom: 1px;
        font-size: 8px;
        font-weight: 700;
        line-height: 1;
      }
      #music-queue li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .music-drop {
        flex: none;
        border: none;
        background: none;
        color: inherit;
        opacity: 0.4;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        line-height: 1;
        padding: 0 2px;
      }
      .music-drop:hover { opacity: 0.9; }
      #music-queue li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      #music-upnext {
        margin: 8px 0 2px;
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        opacity: 0.4;
      }
      #music-queue { list-style: none; margin: 0 0 8px; }
      #music-queue li {
        padding: 4px 0;
        font-size: 12px;
        opacity: 0.75;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #music-search {
        width: 100%;
        border: none;
        border-radius: 10px;
        padding: 8px 10px;
        margin-top: 4px;
        background: rgba(43, 58, 42, 0.06);
        color: inherit;
        font: inherit;
        font-size: 12.5px;
        outline: none;
      }
      #music-search::placeholder { color: rgba(43, 58, 42, 0.4); }
      #music-links {
        display: flex;

      .music-row {

      .music-empty {

      .music-add {

        border: none;
        background: rgba(43, 58, 42, 0.06);

        height: 22px;
        border-radius: 7px;

      #treasure-panel {
        position: fixed;
        top: 64px;
        left: 14px;

      #treasure-panel header {

      }
      #treasure-min {
        border: none;
        background: none;

      #treasure-body {

      .tr-thumb {

      .tr-title {

      /* the sign at a doorstep: a small card in the Treasures panel's glass */

      }
      #sign-close {

        gap: 12px;

      #sign-action[hidden] {

      #sign-action {
        align-self: flex-start;
        border: none;
        border-radius: 999px;

        font: inherit;
        font-size: 13px;

      #toast[hidden] {
        display: none;
      }
      #toast {
        position: fixed;
        bottom: max(118px, calc(78px + var(--actions-h, 0px)));

        border-radius: 12px;
        font-size: 13px;

      /* --- postcard ----------------------------------------------------- */
      #postcard[hidden] {
        display: none;
      }
      #postcard {
        position: fixed;
        inset: 0;
        z-index: 9;
        background: rgba(30, 40, 60, 0.55);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        padding: 28px 16px 40px;
      }
      .pc-sheet {
        width: min(640px, 100%);
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin: auto 0;
        position: relative;
      }
      .pc-ask {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(24, 36, 28, 0.38);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
      }
      .pc-ask-card {
        width: min(320px, 100%);
        background: #fffdf8;
        border-radius: 18px;
        box-shadow: 0 18px 48px rgba(20, 36, 24, 0.24);
        padding: 22px 18px 16px;
        color: #2b3a2a;
      }
      .pc-ask-card p {
        font-size: 16px;
        font-weight: 600;
        line-height: 1.4;
        text-align: center;
      }
      .pc-ask-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 18px;
      }
      .pc-ask-actions button {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 11px 14px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .pc-ask-no {
        background: rgba(43, 58, 42, 0.07);
        color: #2b3a2a;
      }
      .pc-ask-no:hover { background: rgba(43, 58, 42, 0.12); }
      .pc-ask-yes {
        background: #3f8f52;
        color: white;
      }
      .pc-ask-yes:hover { background: #357a46; }
      .pc-ask-yes.away {
        background: #c46a4a;
      }
      .pc-ask-yes.away:hover { background: #b05d40; }
      .pc-close {
        position: absolute;
        top: -12px;
        right: -12px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: none;
        background: rgba(255, 255, 253, 0.92);
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        font-size: 12px;
        z-index: 1;
      }
      .pc-card {
        aspect-ratio: 3 / 2;
        display: grid;
        grid-template-columns: 58fr 42fr;
        background-color: #fbf6e9;
        background-image: radial-gradient(rgba(120, 90, 40, 0.05) 1px, transparent 1px);
        background-size: 5px 5px;
        border-radius: 6px;
        border: 1px solid #d9cfba;
        box-shadow:
          0 12px 32px rgba(20, 30, 40, 0.4),
          inset 0 0 0 4px #fbf6e9,
          inset 0 0 0 5px #d9cfba;
        position: relative;
        overflow: hidden;
      }
      .pc-card > * {
        min-height: 0;
      }
      .pc-msg {
        padding: 28px 22px 26px 28px;
        position: relative;
        display: flex;
        overflow: hidden;
      }
      .pc-msg::after {
        content: "";
        position: absolute;
        top: 24px;
        bottom: 24px;
        right: 0;
        border-right: 1.5px dashed #c9bda3;
      }
      .pc-text {
        font-family: Caveat, "Segoe Print", "Bradley Hand", cursive;
        font-weight: 500;
        font-size: 22px;
        line-height: 1.35;
        color: #2f3a5a;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        background: transparent;
        border: none;
        resize: none;
        outline: none;
        padding: 0;
        margin: 0;

      .pc-text::placeholder {
        color: rgba(47, 58, 90, 0.35);
      }
      .pc-empty {
        color: rgba(47, 58, 90, 0.45);
        font-style: italic;
      }
      .pc-count {
        position: absolute;
        left: 28px;
        bottom: 8px;
        font-size: 10px;
        color: rgba(47, 58, 90, 0.4);
      }
      .pc-side {
        padding: 18px 20px 18px 22px;
        display: flex;
        flex-direction: column;
        position: relative;
        color: #2f3a5a;
      }
      .pc-stamp {
        align-self: flex-end;
        width: 64px;
        height: 74px;
        padding: 0 3px;
        background: #e9eef6;
        border: 3px dotted #fbf6e9;
        outline: 1px solid #c9bda3;
        border-radius: 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        gap: 2px;
        font-size: 26px;
        line-height: 1;
      }
      .pc-stamp span {
        margin: auto 0;
      }
      .pc-stamp small {
        font-size: 6px;
        letter-spacing: 0.5px;
        white-space: nowrap;
        padding-bottom: 3px;
        font-weight: 600;
        opacity: 0.7;
        text-transform: uppercase;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pc-postmark {
        position: absolute;
        top: 46px;
        right: 70px;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 1.5px solid rgba(47, 58, 90, 0.5);
        outline: 1.5px solid rgba(47, 58, 90, 0.5);
        outline-offset: -7px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 8.5px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        text-align: center;
        color: rgba(47, 58, 90, 0.7);
        transform: rotate(-12deg);
        pointer-events: none;
        padding: 0 10px;
      }
      .pc-postmark span {
        max-width: 100%;
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .pc-to {
        margin-top: 30px;
        font-size: 13px;
      }
      .pc-to b {
        font-family: Caveat, cursive;
        font-size: 21px;
        font-weight: 500;
      }
      .pc-line {
        border-bottom: 1px dotted rgba(47, 58, 90, 0.45);
        height: 26px;
        font-family: Caveat, cursive;
        font-size: 18px;
        padding-left: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pc-from {
        margin-top: auto;
        align-self: flex-end;
        font-family: Caveat, cursive;
        font-size: 20px;
        transform: rotate(-3deg);
      }
      .pc-prints {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      }
      .pc-print {
        background: #fff;
        padding: 8px 8px 24px;
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.35);
        transform: rotate(-2deg);
        position: relative;
      }
      .pc-print:nth-child(even) {
        transform: rotate(2deg);
      }
      .pc-print img,
      .pc-print video {
        display: block;
        width: 150px;
        height: 150px;
        object-fit: cover;
        cursor: pointer;
        margin: 0;
        border-radius: 0;
        max-width: none;
        max-height: none;
      }
      .pc-x {
        position: absolute;
        top: -9px;
        right: -9px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: none;
        background: rgba(43, 58, 42, 0.85);
        color: white;
        font-size: 10px;
        cursor: pointer;
      }
      .pc-add {
        width: 166px;
        height: 190px;
        border: 2px dashed rgba(255, 255, 253, 0.6);
        border-radius: 8px;
        background: rgba(255, 255, 253, 0.15);
        color: white;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .pc-add[hidden] {
        display: none;
      }
      .pc-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: white;
        font-size: 14px;
      }
      .pc-announce {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
      }
      .pc-primary {
        border: none;
        border-radius: 14px;
        padding: 10px 18px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        background: #58b368;
        color: white;
        cursor: pointer;
        box-shadow: 0 2px 12px rgba(30, 60, 30, 0.3);
      }
      .pc-primary:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .pc-secondary {
        border: none;
        border-radius: 14px;
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        background: rgba(255, 255, 253, 0.85);
        color: var(--ink);
        cursor: pointer;
      }
      .pc-secondary:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .pc-label {
        border: none;
        border-radius: 12px;
        padding: 9px 12px;
        font: inherit;
        font-size: 14px;
        background: rgba(255, 255, 253, 0.92);
        color: var(--ink);
        width: min(100%, 260px);
        outline-color: #58b368;
      }
      .pc-error {
        width: 100%;
        text-align: center;
        color: #ffb4b4;
        font-size: 13px;
        min-height: 1em;
      }
      .pc-footer {
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 253, 0.85);
        font-size: 13px;
      }
      /* --- the chest icon ------------------------------------------------ */
      .chest-icon {
        width: 1.2em;
        height: 1.05em;
        vertical-align: -0.16em;
        display: inline-block;
        flex: none;
      }
      #treasure-open .chest-icon {
        width: 24px;
        height: 21px;
        display: block;
      }
      /* --- what kind of box: postcard, note, just photos ------------------ */
      .pc-styles {
        display: flex;
        justify-content: center;
        gap: 6px;
      }
      .pc-styles button {
        border: 2px solid transparent;
        border-radius: 12px;
        padding: 6px 12px;
        background: rgba(255, 255, 253, 0.85);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .pc-styles button.picked {
        border-color: #58b368;
        background: #e3f3d9;
      }
      .pc-body {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      /* --- the two faces of a postcard ------------------------------------ */
      .pc-flip {
        position: relative;
        perspective: 1400px;
      }
      .pc-flipper {
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.4, 0.15, 0.2, 1);
      }
      .pc-flipper.pc-flipped {
        transform: rotateY(180deg);
      }
      .pc-face {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .pc-face-picture {
        position: absolute;
        inset: 0;
        transform: rotateY(180deg);
      }
      .pc-face[inert] {
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .pc-flipper {
          transition: none;
        }
      }
      /* --- the picture face ---------------------------------------------- */
      .pc-picture {
        position: absolute;
        inset: 0;
        border-radius: 6px;
        overflow: hidden;
        background: #fbf6e9;
        box-shadow: 0 12px 32px rgba(20, 30, 40, 0.4);
        /* the writing card's 1px edge, drawn inside so both faces keep one size */
        outline: 1px solid #d9cfba;
        outline-offset: -1px;
        user-select: none;
        -webkit-user-select: none;
      }
      /* only the editor drags and pinches; the read view lets a finger scroll the dialog */
      .pc-picture.pc-edit {
        touch-action: none;
      }
      .pc-photo {
        position: absolute;
        display: block;
        max-width: none;
        max-height: none;
      }
      .pc-edit .pc-photo {
        cursor: grab;
      }
      .pc-edit .pc-photo:active {
        cursor: grabbing;
      }
      /* in the read view a click turns the card */
      .pc-read .pc-photo {
        cursor: pointer;
      }
      .pc-picture-frame {
        position: absolute;
        /* room below for the pill */
        inset: 14px 14px 40px;
        border: 2px dashed #c9bda3;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #8a7a50;
      }
      .pc-picture-frame small {
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 6px;
      }
      /* the caption sits above the pill and the slider, never under them */
      .pc-cap,
      .pc-cap-in {
        position: absolute;
        left: 18px;
        bottom: 38px;
        max-width: calc(100% - 36px);
        font-family: Caveat, "Segoe Print", "Bradley Hand", cursive;
        font-weight: 500;
        font-size: 26px;
        /* whole pixels: the field's height comes from scrollHeight, which rounds */
        line-height: 31px;
        color: #fff;
        text-shadow:
          0 1px 4px rgba(0, 0, 0, 0.65),
          0 0 12px rgba(0, 0, 0, 0.35);
        white-space: pre-wrap;
        overflow-wrap: break-word;
        /* the same box on both: the field's dashed underline is transparent on the read caption */
        display: block;
        box-sizing: content-box;
        margin: 0;
        padding: 0;
        border: none;
        border-bottom: 1px dashed transparent;
      }
      /* the caption field: grows a line at a time (height set from scrollHeight) and wraps like .pc-cap */
      .pc-cap-in {
        width: calc(100% - 36px);
        background: transparent;
        outline: none;
        resize: none;
        overflow: hidden;
      }
      .pc-cap-in::placeholder {
        color: rgba(255, 255, 255, 0.7);
      }
      .pc-cap-in:focus {
        border-bottom-color: rgba(255, 255, 255, 0.7);
      }
      .pc-tools {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        gap: 6px;
      }
      .pc-tool {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: none;
        padding: 0;
        background: rgba(20, 25, 35, 0.55);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .pc-tool svg {
        width: 17px;
        height: 17px;
      }
      .pc-tool:hover {
        background: rgba(20, 25, 35, 0.8);
      }
      .pc-zoom {
        position: absolute;
        right: 14px;
        bottom: 16px;
        width: 90px;
        height: 4px;
        margin: 0;
        accent-color: #fff;
        opacity: 0.85;
        cursor: pointer;

        position: relative;
        background-color: #fffdf8;
        background-image: repeating-linear-gradient(transparent 0 29px, rgba(47, 58, 90, 0.13) 29px 30px);
        background-position: 0 28px;
        border-radius: 4px;
        box-shadow: 0 12px 32px rgba(20, 30, 40, 0.4);
        padding: 28px 30px 34px;
        max-height: 60vh;
        overflow-y: auto;
      }
      .pc-note .pc-text {
        line-height: 30px;
        height: 240px;
      }
      .pc-note div.pc-text {
        height: auto;
        min-height: 120px;
        overflow: visible;
      }
      .pc-note .pc-count {
        left: 30px;
        bottom: 10px;
      }
      /* the sender types the dressing straight onto the card */
      .pc-editing input {
        font: inherit;
        color: inherit;
        background: transparent;
        border: none;
        outline: none;
        padding: 0;
        border-bottom: 1px dashed rgba(47, 58, 90, 0.35);
      }
      .pc-editing input:focus {
        border-bottom-color: #58b368;
      }
      .pc-stamp .pc-stamp-in {
        width: 44px !important;
        margin: auto 0;
        text-align: center;
        font-size: 24px;
        line-height: 1.2;
        border-bottom: none;
      }
      .pc-stamp .pc-two {
        font-size: 17px;
      }
      .pc-editing .pc-to-in {
        font-family: Caveat, cursive;
        font-size: 21px;
        font-weight: 500;
        max-width: 100%;
      }
      .pc-line .pc-place-in {
        font-family: Caveat, cursive;
        font-size: 18px;
        width: 100%;
        height: 24px;
        padding-left: 4px;
        border-bottom: none;
      }
      .pc-editing .pc-from-in {
        font-family: Caveat, cursive;
        font-size: 20px;
        max-width: 160px;
      }
      /* just photos: big prints and a caption */
      .pc-prints.pc-big .pc-print img,
      .pc-prints.pc-big .pc-print video {
        width: 280px;
        height: 280px;
      }
      textarea.pc-caption {
        display: block;
        width: min(100%, 440px);
        height: 48px;
        margin: 0 auto;
        padding: 8px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 253, 0.92);
        font-family: Caveat, cursive;
        font-size: 20px;
        line-height: 1.3;
        color: #2f3a5a;
        resize: none;
        overflow: hidden;
        min-height: 0; /* the phone rule for .pc-text must not stretch the caption */
      }
      .pc-caption-read {
        text-align: center;
        font-family: Caveat, cursive;
        font-size: 24px;
        color: rgba(255, 255, 253, 0.95);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
        white-space: pre-wrap;
      }
      .pc-danger {
        border: none;
        border-radius: 14px;
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        background: rgba(208, 90, 90, 0.9);
        color: white;
        cursor: pointer;
      }
      /* --- photo mode: a viewfinder over the world -------------------------- */
      #photo[hidden] {
        display: none;
      }
      #photo {
        position: fixed;
        inset: 0;
        z-index: 2;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
      }
      #photo.ph-dragging {
        cursor: grabbing;
      }
      #ph-window {
        position: absolute;
        left: 50%;
        top: 45%;
        width: min(92vw, 105vh);
        aspect-ratio: 3 / 2;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 0 200vmax rgba(10, 14, 22, 0.55);
        border-radius: 4px;
        pointer-events: none;
      }
      .ph-corner {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 2px solid rgba(255, 255, 255, 0.9);
      }
      .ph-corner.tl { left: -2px; top: -2px; border-right: none; border-bottom: none; }
      .ph-corner.tr { right: -2px; top: -2px; border-left: none; border-bottom: none; }
      .ph-corner.bl { left: -2px; bottom: -2px; border-right: none; border-top: none; }
      .ph-corner.br { right: -2px; bottom: -2px; border-left: none; border-top: none; }
      #ph-back {
        position: absolute;
        left: 16px;
        top: 16px;
        border: none;
        border-radius: 14px;
        padding: 9px 14px;
        font: inherit;
        font-size: 14px;
        background: rgba(255, 255, 253, 0.9);
        color: var(--ink);
        cursor: pointer;
      }
      #ph-hint {
        position: absolute;
        left: 50%;
        top: calc(45% + min(92vw, 105vh) / 3 + 14px);
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.85);
        font-size: 12px;
        text-align: center;
        white-space: nowrap;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      #ph-shutter {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 4px solid rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.25);
        cursor: pointer;
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.25);
      }
      #ph-shutter::after {
        content: "";
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background: #fff;
      }
      #ph-shutter:active::after {
        inset: 9px;
      }
      /* the flash lives outside #photo: the viewfinder hides the moment the shutter fires, the flash fades after */
      #ph-flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 12;
      }
      #ph-flash.ph-go {
        animation: ph-flash 0.35s ease-out;
      }
      @keyframes ph-flash {
        from { opacity: 0.9; }
        to { opacity: 0; }
      }
      /* while the viewfinder is up the HUD steps aside; the d-pad and the zoom slider stay on top.
         On phones the shutter keeps the freed bottom row, beside the d-pad's down arrow and clear of its side arrows. */
      body.photo #chat-panel,
      body.photo #chat-open,
      body.photo #chat-form,
      body.photo #treasure-open,
      body.photo #treasure-panel,
      body.photo #music-open,
      body.photo #music-panel,
      body.photo #sky-lyrics,
      body.photo #actions,
      body.photo #sign,
      body.photo #bubbles,
      body.photo #box-labels,
      body.photo #status,
      body.photo #toast {
        display: none !important;
      }
      body.photo.touch #dpad,
      body.photo.touch #zoom-slider {
        z-index: 3;
      }
      /* --- placing mode: the shade on the ground and the bar at the bottom ---- */
      body.placing #chat-panel,
      body.placing #chat-open,
      body.placing #chat-form,
      body.placing #treasure-open,
      body.placing #treasure-panel,
      body.placing #music-open,
      body.placing #music-panel,
      body.placing #sky-lyrics,
      body.placing #actions,
      body.placing #sign,
      body.placing #box-labels {
        display: none !important;
      }
      #placing[hidden] {
        display: none;
      }
      #placing {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        max-width: calc(100vw - 32px);
        box-sizing: border-box;
        background: rgba(255, 255, 253, 0.72);
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        border-radius: 16px;
        box-shadow: 0 1px 6px rgba(30, 60, 30, 0.12);
        color: rgba(43, 58, 42, 0.9);
        user-select: none;
        -webkit-user-select: none;
      }
      #pl-hint {
        font-size: 13px;
        line-height: 1.2;
        white-space: nowrap;
      }
      #pl-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #pl-sizes {
        display: flex;
        gap: 4px;
      }
      #pl-sizes[hidden] {
        display: none;
      }
      #placing button {
        border: none;
        border-radius: 12px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      #pl-sizes button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 2px solid transparent;
        background: rgba(255, 255, 253, 0.9);
        color: var(--ink);
        font-size: 14px;
        font-weight: 600;
      }
      #pl-sizes button.picked {
        border-color: #58b368;
        background: #e3f3d9;
      }
      #pl-sizes button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #pl-put {
        height: 36px;
        padding: 0 16px;
        background: #58b368;
        color: white;
        font-size: 15px;
        font-weight: 600;
        box-shadow: 0 2px 10px rgba(30, 60, 30, 0.25);
      }
      #pl-put:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        box-shadow: none;
      }
      #pl-cancel {
        height: 36px;
        padding: 0 14px;
        background: rgba(255, 255, 253, 0.9);
        color: var(--ink);
        font-size: 14px;
      }
      #pl-cancel:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      /* on a touch phone the bar stays below the d-pad (bottom 88px) and clear of its column */
      body.touch #placing {
        bottom: 10px;
        padding: 6px 8px;
        gap: 4px;
      }
      /* the postcard dialog steps aside during photo mode without closing */
      #postcard.pc-away {
        display: none;
      }
      /* narrow screens: the hint wraps; on touch the window and the hint also step left,
         clear of the zoom slider's column (12px gutter + 40px slider) */
      @media (max-width: 560px) {
        #ph-hint {
          width: max-content;
          max-width: 80vw;
          white-space: normal;
          text-wrap: balance;
        }
        body.touch #ph-window {
          left: calc(50% - 26px);
          width: min(80vw, 105vh);
        }
        body.touch #ph-hint {
          left: calc(50% - 26px);
          top: calc(45% + min(80vw, 105vh) / 3 + 14px);
        }
      }
      @media (max-width: 560px) {
        .pc-card {
          aspect-ratio: auto;
          grid-template-columns: 1fr;
        }
        .pc-msg {
          min-height: 220px;
          padding: 24px 20px 26px 22px;
        }
        .pc-msg::after {
          border-right: none;
          border-bottom: 1.5px dashed #c9bda3;
          top: auto;
          bottom: 0;
          left: 22px;
          right: 22px;
        }
        .pc-text {
          font-size: 20px;
          height: auto;
          min-height: 170px;
        }
        .pc-count {
          left: 22px;
        }
        .pc-side {
          padding-top: 22px;
          padding-bottom: 22px;
        }
        .pc-postmark {
          top: 36px;
          right: 68px;
        }
        .pc-print img,
        .pc-print video {
          width: 120px;
          height: 120px;
        }
        .pc-prints.pc-big .pc-print img,
        .pc-prints.pc-big .pc-print video {
          width: 200px;
          height: 200px;
        }
        .pc-note {
          padding: 22px 20px 28px;
        }
        .pc-note .pc-text {
          height: 200px;
        }
      }
      #loading,
      #full-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-size: 18px;
        background: linear-gradient(#7d85c1, #f59a7e, #ffc46b);
      }
      #login[hidden] {
        display: none;
      }
      #login {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(#7d85c1, #f59a7e, #ffc46b);
      }
      #login form {
        background: var(--paper);
        border-radius: 20px;
        padding: 28px 32px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        box-shadow: 0 6px 30px rgba(30, 60, 30, 0.25);
        min-width: 280px;
      }
      #login h1 {
        font-size: 20px;
      }
      #login-who {
        display: flex;
        gap: 10px;
      }
      #login-who button {
        border: 2px solid transparent;
        border-radius: 14px;
        padding: 12px 18px;
        font: inherit;
        font-size: 15px;
        background: #eef0f4;
        cursor: pointer;
      }
      #login-who button.picked {
        border-color: #58b368;
        background: #e3f3d9;
      }
      #login-who button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #login input {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        background: #eef0f4;
        width: 100%;
        box-sizing: border-box;
        outline-color: #58b368;
      }
      #login button[type="submit"] {
        border: none;
        border-radius: 14px;
        padding: 10px 22px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;

      #login-note {
        font-size: 13px;

        text-align: center;
        max-width: 240px;
      }
      #login button[type="submit"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>

    <div id="ph-flash"></div>
    <div id="placing" hidden>
      <div id="pl-hint">Walk to move the shade</div>
      <div id="pl-row">
        <div id="pl-sizes">
          <button type="button" data-size="s" title="1 square">S</button>
          <button type="button" data-size="m" title="4 squares">M</button>
          <button type="button" data-size="l" title="12 squares">L</button>
        </div>
        <button type="button" id="pl-put">Put it down<span class="key-hint"> (E)</span></button>
        <button type="button" id="pl-cancel">Cancel</button>
      </div>
    </div>
    <div id="lightbox" hidden></div>
    <div id="postcard" hidden></div>
    <input id="pc-file" type="file" accept="image/*,video/*" multiple hidden />
    <div id="toast" hidden></div>
    <div id="login" hidden>
      <form id="login-form">
        <h1>Who are you? 🌍</h1>
        <div id="login-who">
          <button type="button" data-id="0">…</button>
          <button type="button" data-id="1">…</button>
        </div>
        <div id="login-note" hidden></div>
        <input id="login-pass" type="password" placeholder="Secret word" autocomplete="current-password" />
        <input id="login-pass2" type="password" placeholder="Type it again" autocomplete="new-password" hidden />
        <button type="submit" id="login-submit">Step onto the planet</button>
        <div id="login-error"></div>
      </form>
    </div>
    <div id="loading">Loading Haven…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
