<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Planet</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>"
    />
    <style>
      :root {
        --ink: #2b3a2a;
        --paper: rgba(255, 255, 253, 0.88);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", Quicksand,
          Comfortaa, Manjari, sans-serif;
        color: var(--ink);
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        bottom: 10px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        opacity: 0.55;
        pointer-events: none;
        user-select: none;
      }
      #dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #d05a5a;
        display: inline-block;
      }
      #dot.on {
        background: #58b368;
      }
      /* --- chat ------------------------------------------------------- */
      #bubbles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .name-tag {
        position: absolute;
        transform: translate(-50%, calc(-100% - 4px));
        display: flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        color: #2b3a2a;
        background: rgba(255, 255, 253, 0.55);
        border-radius: 8px;
        padding: 1px 7px;
        white-space: nowrap;
        transition: opacity 0.15s;
        user-select: none;
      }
      .name-tag button {
        border: none;
        background: none;
        cursor: pointer;
        font-size: 9px;
        padding: 0;
        opacity: 0.6;
        pointer-events: auto;
      }
      .name-tag button:hover {
        opacity: 1;
      }
      .bubble {
        position: absolute;
        transform: translate(-50%, calc(-100% - 34px));
        background: var(--paper);
        border-radius: 12px;
        padding: 7px 11px;
        font-size: 14px;
        max-width: 230px;
        width: max-content;
        overflow-wrap: break-word;
        box-shadow: 0 2px 10px rgba(30, 60, 30, 0.2);
        transition: opacity 0.15s;
      }
      .bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        transform: translateX(-50%);
        border: 8px solid transparent;
        border-top-color: var(--paper);
        border-bottom: none;
      }
      #chat-form {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
      }
      #chat-preview[hidden] {
        display: none;
      }
      #chat-preview {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        display: flex;
        align-items: flex-start;
        gap: 4px;
        background: rgba(255, 255, 253, 0.75);
        backdrop-filter: blur(6px);
        border-radius: 12px;
        padding: 6px;
        box-shadow: 0 1px 8px rgba(30, 60, 30, 0.18);
      }
      #chat-preview img,
      #chat-preview video {
        max-width: 92px;
        max-height: 92px;
        border-radius: 8px;
        display: block;
      }
      #chat-preview button {
        border: none;
        background: rgba(43, 58, 42, 0.12);
        border-radius: 50%;
        width: 20px;
        height: 20px;
        font-size: 10px;
        cursor: pointer;
        padding: 0;
      }
      #enter {
        position: fixed;
        bottom: 68px;
        left: 50%;
        transform: translateX(-50%);
        border: none;
        border-radius: 14px;
        padding: 10px 18px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        background: #58b368;
        color: white;
        cursor: pointer;
        box-shadow: 0 2px 12px rgba(30, 60, 30, 0.3);
      }
      #enter:hover {
        transform: translateX(-50%) translateY(-1px);
      }
      #chat-input {
        width: min(46vw, 380px);
        border: none;
        border-radius: 14px;
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        background: rgba(255, 255, 253, 0.6);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        color: var(--ink);
        box-shadow: 0 1px 8px rgba(30, 60, 30, 0.14);
        outline-color: #58b368;
      }
      #chat-form button {
        border: none;
        border-radius: 14px;
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        background: rgba(255, 255, 253, 0.6);
        color: var(--ink);
        cursor: pointer;
        box-shadow: 0 1px 8px rgba(30, 60, 30, 0.14);
      }
      #chat-form button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .bubble img,
      .bubble video,
      .msg img,
      .msg video {
        display: block;
        max-width: 180px;
        max-height: 140px;
        border-radius: 8px;
        margin-top: 4px;
        cursor: pointer;
        pointer-events: auto;
      }
      .msg img,
      .msg video {
        max-width: 100%;
      }
      #lightbox[hidden] {
        display: none;
      }
      #lightbox {
        position: fixed;
        inset: 0;
        background: rgba(10, 10, 16, 0.88);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
      }
      #lightbox img,
      #lightbox video {
        max-width: 92vw;
        max-height: 92vh;
        border-radius: 10px;
      }
      #chat-panel {
        position: fixed;
        top: 14px;
        right: 14px;
        width: 230px;
        background: rgba(255, 255, 253, 0.42);
        backdrop-filter: blur(7px);
        -webkit-backdrop-filter: blur(7px);
        border-radius: 14px;
        box-shadow: 0 1px 6px rgba(30, 60, 30, 0.12);
        overflow: hidden;
        font-size: 12.5px;
        color: rgba(43, 58, 42, 0.85);
      }
      #chat-panel header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 8px 8px 12px;
        font-weight: 600;
      }
      #chat-min {
        border: none;
        background: none;
        font: inherit;
        cursor: pointer;
        padding: 0 6px;
        color: var(--ink);
      }
      #chat-log {
        max-height: 38vh;
        overflow-y: auto;
        padding: 0 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #chat-log:empty::before {
        content: "No messages yet — say hi!";
        opacity: 0.55;
      }
      .msg {
        border-radius: 10px;
        padding: 5px 9px;
        overflow-wrap: break-word;
      }
      .msg {
        position: relative;
      }
      .msg .recall {
        position: absolute;
        top: 2px;
        right: 3px;
        border: none;
        background: none;
        font-size: 10px;
        cursor: pointer;
        opacity: 0.3;
        padding: 0 2px;
      }
      .msg .recall:hover {
        opacity: 1;
      }
      .msg.me {
        background: rgba(211, 236, 195, 0.55);
        align-self: flex-end;
      }
      .msg.peer {
        background: rgba(230, 233, 240, 0.55);
        align-self: flex-start;
      }
      #chat-open {
        position: fixed;
        top: 14px;
        right: 14px;
        border: none;
        border-radius: 14px;
        padding: 8px 11px;
        font-size: 15px;
        background: rgba(255, 255, 253, 0.45);
        cursor: pointer;
        box-shadow: 0 1px 6px rgba(30, 60, 30, 0.12);
        opacity: 0.85;
      }
      #chat-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #d05a5a;
        color: white;
        font-size: 11px;
        border-radius: 9px;
        padding: 2px 6px;
      }
      #loading,
      #full-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        font-size: 18px;
        background: linear-gradient(#7d85c1, #f59a7e, #ffc46b);
      }
      #login[hidden] {
        display: none;
      }
      #login {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(#7d85c1, #f59a7e, #ffc46b);
      }
      #login form {
        background: var(--paper);
        border-radius: 20px;
        padding: 28px 32px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        box-shadow: 0 6px 30px rgba(30, 60, 30, 0.25);
        min-width: 280px;
      }
      #login h1 {
        font-size: 20px;
      }
      #login-who {
        display: flex;
        gap: 10px;
      }
      #login-who button {
        border: 2px solid transparent;
        border-radius: 14px;
        padding: 12px 18px;
        font: inherit;
        font-size: 15px;
        background: #eef0f4;
        cursor: pointer;
      }
      #login-who button.picked {
        border-color: #58b368;
        background: #e3f3d9;
      }
      #login-who button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      #login input {
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
        font-size: 14px;
        background: #eef0f4;
        width: 100%;
        box-sizing: border-box;
        outline-color: #58b368;
      }
      #login button[type="submit"] {
        border: none;
        border-radius: 14px;
        padding: 10px 22px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        background: #58b368;
        color: white;
        cursor: pointer;
      }
      #login-error {
        color: #d05a5a;
        font-size: 13px;
        min-height: 1em;
      }
      #login-note {
        font-size: 13px;
        opacity: 0.8;
        text-align: center;
        max-width: 240px;
      }
      #login button[type="submit"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="status"><span id="dot"></span><span id="status-text"></span></div>
    <button id="enter" hidden>Enter</button>
    <div id="bubbles"></div>
    <div id="chat-panel">
      <header>
        <span>Chat 💬</span>
        <button id="chat-min" title="Minimize">—</button>
      </header>
      <div id="chat-log"></div>
    </div>
    <button id="chat-open" hidden>💬<span id="chat-badge" hidden></span></button>
    <form id="chat-form" autocomplete="off">
      <div id="chat-preview" hidden>
        <span id="chat-preview-thumb"></span>
        <button type="button" id="chat-preview-x" title="Remove">✕</button>
      </div>
      <input id="chat-input" maxlength="200" placeholder="Say something… (Enter)" />
      <button type="button" id="chat-attach" title="Attach a photo or video">📷</button>
      <button type="submit" id="chat-send">Send</button>
      <input id="chat-file" type="file" accept="image/*,video/*" hidden />
    </form>
    <div id="lightbox" hidden></div>
    <div id="login" hidden>
      <form id="login-form">
        <h1>Who are you? 🌍</h1>
        <div id="login-who">
          <button type="button" data-id="0">…</button>
          <button type="button" data-id="1">…</button>
        </div>
        <div id="login-note" hidden></div>
        <input id="login-pass" type="password" placeholder="Secret word" autocomplete="current-password" />
        <input id="login-pass2" type="password" placeholder="Type it again" autocomplete="new-password" hidden />
        <button type="submit" id="login-submit">Step onto the planet</button>
        <div id="login-error"></div>
      </form>
    </div>
    <div id="loading">Loading tiny planet…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
