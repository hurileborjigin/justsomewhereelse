# fly.toml app configuration file generated for tiny-planet-gk on 2026-09-22T22:42:46+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tiny-planet-gk'
primary_region = 'fra'

[build]
[env]
  DB_PATH = '/data/planet.db'
  PORT = '3001'
  # open door while testing - remove this line (and fly deploy) to require
  # the secret word again
  PLANET_OPEN = '1'

[[mounts]]
  source = 'planet_data'
  destination = '/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
