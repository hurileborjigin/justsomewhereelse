# Manual maintenance: forget the shared secret word on the live planet so that
# identity 0 (gloria) chooses a new one at her next visit. Start it from the
# Actions tab ("Run workflow"). It runs scripts/forget-secret-word.mjs inside
# the Fly machine; the server keeps running and picks the change up at once.

name: Reset the secret word
on:
  workflow_dispatch:
jobs:
  reset:
    name: Forget the secret word
    runs-on: ubuntu-latest
    concurrency: deploy-group # never while a deploy is replacing the machine
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Which secrets exist (names only)
        run: flyctl secrets list -a tiny-planet-gk
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Forget the stored word
        run: flyctl ssh console -a tiny-planet-gk -C "node /app/scripts/forget-secret-word.mjs"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
